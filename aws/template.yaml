AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Trombone Coach - online opslag met login. Alleen jouw gegevens, alleen voor jou.
  Login (Cognito), een kleine API (API Gateway + Lambda), een database (DynamoDB)
  en een budgetalarm. Bedoeld om binnen de gratis laag van AWS te blijven.

Parameters:
  Email:
    Type: String
    Description: Je e-mailadres. Hiermee log je in; je krijgt er een tijdelijk wachtwoord op.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: Vul een geldig e-mailadres in.
  AppUrl:
    Type: String
    Default: https://sjnirk.github.io/trombone-tuner/
    Description: Adres van de app (hierheen stuurt de login je terug). Laat staan.
  AppOrigin:
    Type: String
    Default: https://sjnirk.github.io
    Description: Herkomst van de app voor CORS. Laat staan.
  BudgetUsd:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Je krijgt een e-mail als de AWS-kosten deze maand boven dit bedrag in dollars dreigen te komen (ruim boven wat dit hoort te kosten).

Resources:
  # ---------- opslag ----------
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      SSESpecification: { SSEEnabled: true }

  # ---------- login ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "trombone-coach-${AWS::StackName}"
      DeletionProtection: ACTIVE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: Je login voor Trombone Coach
          EmailMessage: "Je kunt inloggen bij Trombone Coach met {username}. Tijdelijk wachtwoord: {####} (bij de eerste keer kies je een eigen wachtwoord)."
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: false
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Join ["-", ["trombone-coach", !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref "AWS::StackId"]]]]]]

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: trombone-coach-app
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Ref AppUrl]
      LogoutURLs: [!Ref AppUrl]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_SRP_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 365
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }

  Me:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref Email
      DesiredDeliveryMediums: [EMAIL]
      UserAttributes:
        - { Name: email, Value: !Ref Email }
        - { Name: email_verified, Value: "true" }

  # ---------- API ----------
  FnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: tabel
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: !GetAtt Table.Arn

  FnLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Fn}"
      RetentionInDays: 14

  Fn:
    Type: AWS::Lambda::Function
    Properties:
      Description: Trombone Coach - lezen en schrijven van eigen gegevens
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt FnRole.Arn
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          TABLE: !Ref Table
      Code:
        ZipFile: |
          const { DynamoDBClient } = require("@aws-sdk/client-dynamodb");
          const { DynamoDBDocumentClient, QueryCommand, PutCommand, DeleteCommand } = require("@aws-sdk/lib-dynamodb");
          const db = DynamoDBDocumentClient.from(new DynamoDBClient({}));
          const T = process.env.TABLE;
          const OK = /^(settings\/profiel|log\/\d{4}-\d{2}-\d{2}|voortgang\/w\d+-b\d+-s\d+|stukken\/imp-[a-z0-9-]{1,60})$/;
          const out = (s, b) => ({ statusCode: s, headers: { "content-type": "application/json" }, body: JSON.stringify(b) });
          exports.handler = async (e) => {
            const sub = e.requestContext?.authorizer?.jwt?.claims?.sub;
            if (!sub) return out(401, { fout: "niet ingelogd" });
            const m = e.requestContext.http.method;
            if (m === "GET") {
              const items = {}; let k;
              do {
                const r = await db.send(new QueryCommand({ TableName: T, KeyConditionExpression: "pk = :p", ExpressionAttributeValues: { ":p": sub }, ExclusiveStartKey: k }));
                (r.Items || []).forEach(i => { items[i.sk] = { data: i.data, t: i.t }; });
                k = r.LastEvaluatedKey;
              } while (k);
              return out(200, { items });
            }
            const path = decodeURIComponent(e.pathParameters?.path || "");
            if (!OK.test(path)) return out(400, { fout: "onbekend pad" });
            if (m === "DELETE") { await db.send(new DeleteCommand({ TableName: T, Key: { pk: sub, sk: path } })); return out(200, { ok: true }); }
            if (m === "PUT") {
              if ((e.body || "").length > 65536) return out(413, { fout: "te groot" });
              let b; try { b = JSON.parse(e.isBase64Encoded ? Buffer.from(e.body, "base64").toString() : e.body); } catch (x) { return out(400, { fout: "geen json" }); }
              const t = Number(b.t);
              if (!b.data || typeof b.data !== "object" || Array.isArray(b.data) || !Number.isFinite(t)) return out(400, { fout: "ongeldig" });
              try {
                await db.send(new PutCommand({ TableName: T, Item: { pk: sub, sk: path, data: b.data, t },
                  ConditionExpression: "attribute_not_exists(t) OR t <= :t", ExpressionAttributeValues: { ":t": t } }));
              } catch (x) {
                if (x.name === "ConditionalCheckFailedException") return out(409, { fout: "nieuwere versie aanwezig" });
                throw x;
              }
              return out(200, { ok: true });
            }
            return out(405, { fout: "methode" });
          };

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: trombone-coach-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref AppOrigin]
        AllowMethods: [GET, PUT, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 3600

  ApiAuth:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref Api
      Name: cognito
      AuthorizerType: JWT
      IdentitySource: ["$request.header.Authorization"]
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  ApiFn:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Fn.Arn
      PayloadFormatVersion: "2.0"

  RouteGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: GET /data
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiAuth
      Target: !Sub "integrations/${ApiFn}"

  RoutePut:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: PUT /doc/{path+}
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiAuth
      Target: !Sub "integrations/${ApiFn}"

  RouteDelete:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: DELETE /doc/{path+}
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiAuth
      Target: !Sub "integrations/${ApiFn}"

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Fn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*"

  # ---------- kostenbewaking ----------
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "trombone-coach-${AWS::StackName}"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref BudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref Email }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref Email }]

Outputs:
  AppConfig:
    Description: Kopieer deze regel en plak hem in de chat met Claude. Er zit niets geheims in.
    Value: !Sub '{"region":"${AWS::Region}","domain":"https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com","clientId":"${UserPoolClient}","api":"${Api.ApiEndpoint}"}'
